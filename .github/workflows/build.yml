name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - debug
          - release
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BUILD_CONFIGURATION: ${{ github.event.inputs.configuration == 'release' && 'Release' || github.event.inputs.configuration == 'debug' && 'Debug' || github.ref == 'refs/heads/main' && 'Release' || 'Debug' }}
      DERIVED_DATA_PATH: build/DerivedData
      ARTIFACT_DIR: build/artifacts
    steps:
      - uses: actions/checkout@v6
      - name: Print toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Build
        run: xcodebuild -quiet -project "cmd-eikana.xcodeproj" -scheme "cmd-eikana" -configuration "$BUILD_CONFIGURATION" -derivedDataPath "$DERIVED_DATA_PATH" -destination 'platform=macOS,arch=arm64' build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Sign app for testing
        run: codesign --force --deep --sign - "$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/cmd-eikana.app"
      - name: Package app
        run: |
          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --keepParent "$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/cmd-eikana.app" "$ARTIFACT_DIR/cmd-eikana-$BUILD_CONFIGURATION.zip"
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: cmd-eikana-${{ env.BUILD_CONFIGURATION }}
          path: ${{ env.ARTIFACT_DIR }}/cmd-eikana-${{ env.BUILD_CONFIGURATION }}.zip
          archive: false
          if-no-files-found: error
